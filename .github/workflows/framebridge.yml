name: Build patched FrameBridge

# FrameLoad's patches to FramePort's FrameBridge adapter (native/framebridge). A tag framebridge-<FramePort version>-p<n>
# builds the adapter with them and publishes it as a release; FrameLoad (installer/framebridge_patch.py) downloads it
# by that tag and checks it against the checksums it carries.
on:
  push:
    tags:
      - 'framebridge-*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache the NDK and shader tools
        uses: actions/cache@v4
        with:
          path: /tmp/framebridge-cache
          key: framebridge-${{ hashFiles('native/framebridge/FRAMEPORT_VERSION') }}

      - name: Build
        env:
          FRAMEBRIDGE_CACHE: /tmp/framebridge-cache
        run: native/framebridge/build.sh "$PWD/framebridge-out"

      - name: Publish
        if: startsWith(github.ref, 'refs/tags/framebridge-')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          gh release create "$tag" framebridge-out/* \
            --title "FrameBridge adapter for FrameLoad ($tag)" \
            --notes "FramePort $(cat native/framebridge/FRAMEPORT_VERSION)'s FrameBridge adapter with FrameLoad's patches (native/framebridge). Not a FrameLoad release: FrameLoad downloads this by itself." \
            --prerelease
