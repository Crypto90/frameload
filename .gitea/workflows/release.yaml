name: Build and Release FrameLoad

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  test:
    name: Run Unit Tests
    runs-on: docker
    container:
      image: python:3.11-slim
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Execute Test Suite
        run: |
          python3 -m unittest discover tests

  build-and-release:
    name: Build Packages & Publish Release
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'
    runs-on: docker
    container:
      image: python:3.11-slim
    steps:
      - name: Install Build Tools
        run: |
          apt-get update && apt-get install -y --no-install-recommends git curl tar ca-certificates
          rm -rf /var/lib/apt/lists/*

      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build Standalone Packages
        run: |
          python3 scripts/build_release.py

      - name: Determine Release Tag
        id: release_info
        run: |
          if [[ "${{ github.ref }}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v1.0.0"
          fi
          echo "tag=${TAG}" >> $GITHUB_OUTPUT

      - name: Publish to Forgejo Releases
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_SERVER_URL: ${{ github.server_url }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_REF: ${{ github.ref }}
        run: |
          python3 scripts/forgejo_release.py "${{ steps.release_info.outputs.tag }}"
